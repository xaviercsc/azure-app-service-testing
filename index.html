<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Tools Hub</title>
    <style>
        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: 'Segoe UI', Arial, sans-serif;
            background: linear-gradient(135deg, #003781 0%, #1F6FEB 100%);
            color: white;
        }

        .container {
            text-align: center;
            padding: 40px;
            background: rgba(255,255,255,0.1);
            border-radius: 16px;
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255,255,255,0.2);
            max-width: 500px;
        }

        h1 {
            margin-bottom: 10px;
        }

        .badge {
            display: inline-block;
            background: #00884B;
            padding: 6px 16px;
            border-radius: 20px;
            font-size: 0.85em;
            margin-bottom: 20px;
        }

        .footer {
            margin-top: 30px;
            font-size: 0.8em;
            opacity: 0.7;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>AI Tools Hub</h1>
        <div class="badge">✅ Only to Test Web page access </div>

        <p>
            Welcome to the AI Tools Hub.
        </p>

        <p>
            Authentication to be tested.
        </p>

        <div class="footer">
            New Technology | Azure Static Web Apps
        </div>
    </div>
</body>
</html>
